services:
  postgres:
    extends:
      file: docker-compose.yml
      service: postgres
    networks:
      - mkm-network

  redis:
    extends:
      file: docker-compose.yml
      service: redis
    networks:
      - mkm-network

  mailpit:
    extends:
      file: docker-compose.yml
      service: mailpit
    networks:
      - mkm-network

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: mkm-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ../backend/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://mohanurkongu:mohanurkongu@postgres:5432/mohanurkongu?schema=public
      REDIS_HOST: redis
      SMTP_HOST: mailpit
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      STORAGE_DIR: /storage/media
    volumes:
      - media_storage:/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mkm-network

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend/Dockerfile
    container_name: mkm-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - mkm-network

  nginx:
    build:
      context: ../docker/nginx
      dockerfile: Dockerfile
    container_name: mkm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: 4000
      FRONTEND_HOST: frontend
      FRONTEND_PORT: 80
    volumes:
      - media_storage:/storage:ro
    depends_on:
      - frontend
      - backend
    networks:
      - mkm-network

volumes:
  media_storage:

networks:
  mkm-network:
    driver: bridge
