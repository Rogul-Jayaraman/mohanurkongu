services:
  postgres:
    image: postgres:16-alpine
    container_name: mkm-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: mohanurkongu
      POSTGRES_PASSWORD: mohanurkongu
      POSTGRES_DB: mohanurkongu
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mohanurkongu"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mkm-network

  redis:
    image: redis:7-alpine
    container_name: mkm-redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy noeviction --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mkm-network

  redis-cache:
    image: redis:7-alpine
    container_name: mkm-redis-cache
    restart: unless-stopped
    command: redis-server --port 6380 --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6380"
    volumes:
      - redis_cache_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mkm-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: mkm-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - mkm-network

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend/Dockerfile.dev
    env_file: ../backend/.env
    container_name: mkm-backend-dev
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://mohanurkongu:mohanurkongu@postgres:5432/mohanurkongu?schema=public
      REDIS_QUEUE_HOST: redis
      REDIS_QUEUE_PORT: 6379
      REDIS_CACHE_HOST: redis-cache
      REDIS_CACHE_PORT: 6380
      SMTP_HOST: mailpit
      STORAGE_DIR: /storage/media
    volumes:
      - ../backend/src:/app/src
      - ../backend/prisma:/app/prisma
      - ../backend/package.json:/app/package.json
      - backend_node_modules:/app/node_modules
      - ../storage:/storage
    command: sh -c "npx prisma generate && npx nodemon --legacy-watch --exec tsx src/server.ts --watch src -e ts"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks:
      - mkm-network

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend/Dockerfile.dev
    container_name: mkm-frontend-dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:4000
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/public:/app/public
      - ../frontend/index.html:/app/index.html
      - ../frontend/vite.config.ts:/app/vite.config.ts
      - ../frontend/tsconfig.json:/app/tsconfig.json
      - ../frontend/package.json:/app/package.json
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    networks:
      - mkm-network

  nginx:
    image: nginx:1.27-alpine
    container_name: mkm-nginx-dev
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf
      - ../storage:/storage:ro
      - ../media:/media-mohanurkongu:ro
    depends_on:
      - backend
      - frontend
    networks:
      - mkm-network

volumes:
  postgres_data:
  redis_data:
  redis_cache_data:
  backend_node_modules:
  frontend_node_modules:

networks:
  mkm-network:
    driver: bridge
