services:
  postgres:
    image: postgres:16-alpine
    container_name: mkm-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: mohanurkongu
      POSTGRES_PASSWORD: mohanurkongu
      POSTGRES_DB: mohanurkongu
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mohanurkongu"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mkm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: mkm-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  nginx:
    build:
      context: ../docker/nginx
      dockerfile: Dockerfile
    container_name: mkm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      BACKEND_HOST: host.docker.internal
      BACKEND_PORT: 4000
      FRONTEND_HOST: host.docker.internal
      FRONTEND_PORT: 5173
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  redis_data:
