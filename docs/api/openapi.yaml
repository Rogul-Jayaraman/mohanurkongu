openapi: 3.0.3
info:
  title: Mohanur Kongu Manamaalai API
  description: |
    Matrimony and Mandapam platform API.
    **Status:** Only auth endpoints are implemented. All other endpoints return 404.
  version: 0.1.0
  contact:
    name: Engineering Team
  x-status: pre-production

servers:
  - url: http://localhost:4000/api
    description: Development
  - url: https://<domain>/api
    description: Production

paths:
  /auth/send-otp:
    post:
      tags: [Auth]
      summary: Send OTP for registration or password reset
      operationId: sendOtp
      x-rate-limit: 10/15m
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, type]
              properties:
                email:
                  type: string
                  format: email
                type:
                  type: string
                  enum: [registration, password-reset]
      responses:
        '200':
          description: OTP sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: OTP sent successfully
                  expiresIn:
                    type: integer
                    example: 300
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-bugs:
        - BUG-CRIT-001: OTP never delivered via email

  /auth/verify-otp:
    post:
      tags: [Auth]
      summary: Verify OTP code
      operationId: verifyOtp
      x-rate-limit: 10/15m
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp, type]
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
                  minLength: 5
                  maxLength: 5
                type:
                  type: string
                  enum: [registration, password-reset]
      responses:
        '200':
          description: OTP verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: OTP verified successfully
                  token:
                    type: string
                    description: Verification JWT (BUG-CRIT-003: signed with access secret)
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-bugs:
        - BUG-CRIT-003: Token signed with JWT_ACCESS_SECRET

  /auth/signup:
    post:
      tags: [Auth]
      summary: Create a new account
      operationId: signup
      x-rate-limit: 10/15m
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, confirmPassword, name, token]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
                confirmPassword:
                  type: string
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                token:
                  type: string
                  description: Verification token from verify-otp
      responses:
        '201':
          description: Account created
          headers:
            Set-Cookie:
              schema:
                type: string
                description: refreshToken (httpOnly, secure, sameSite=strict)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Email already registered
        '429':
          $ref: '#/components/responses/RateLimited'
      x-bugs:
        - BUG-CRIT-002: No email match check against verified OTP target
        - BUG-CRIT-004: Welcome email never sent

  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate user
      operationId: login
      x-rate-limit: 10/15m
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                portal:
                  type: string
                  enum: [USER, ADMIN]
                  description: Optional (BUG-MED-004 — omitting skips role check)
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
                description: refreshToken (httpOnly, secure, sameSite=strict, path=/auth)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-bugs:
        - BUG-MED-004: Portal parameter optional — bypasses role check
        - BUG-ADMIN-001: Response lacks profile fields expected by frontend

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user profile
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      operationId: refreshToken
      security:
        - cookieAuth: []
      x-rate-limit: MISSING (BUG-HIGH-003)
      responses:
        '200':
          description: Token refreshed
          headers:
            Set-Cookie:
              schema:
                type: string
                description: New refreshToken
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-bugs:
        - BUG-HIGH-001: Concurrent rotation race
        - BUG-HIGH-003: No rate limiter

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout current session
      operationId: logout
      security:
        - bearerAuth: []
      x-rate-limit: MISSING (BUG-HIGH-003)
      responses:
        '200':
          description: Logged out
          headers:
            Set-Cookie:
              schema:
                type: string
                description: Cleared refreshToken
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged out successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-bugs:
        - BUG-HIGH-003: No rate limiter

  /auth/logout-all:
    post:
      tags: [Auth]
      summary: Logout all sessions
      operationId: logoutAll
      security:
        - bearerAuth: []
      x-rate-limit: 5/15m
      responses:
        '200':
          description: All sessions revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged out from all devices
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset OTP
      operationId: forgotPassword
      x-rate-limit: 5/15m
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: OTP sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password reset OTP sent to email
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-bugs:
        - BUG-CRIT-001: OTP never delivered via email

  /auth/verify-password-otp:
    post:
      tags: [Auth]
      summary: Verify password reset OTP
      operationId: verifyPasswordOtp
      x-rate-limit: 10/15m
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
                  minLength: 5
                  maxLength: 5
      responses:
        '200':
          description: OTP verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: OTP verified
                  token:
                    type: string
                    description: Password reset JWT
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password with token
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password, confirmPassword]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 6
                confirmPassword:
                  type: string
      responses:
        '200':
          description: Password reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password reset successfully
        '400':
          $ref: '#/components/responses/ValidationError'

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change password (authenticated)
      operationId: changePassword
      security:
        - bearerAuth: []
      x-rate-limit: 5/15m
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword, confirmNewPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 6
                confirmNewPassword:
                  type: string
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password changed successfully
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-bugs:
        - BUG-HIGH-002: Doesn't revoke existing sessions

  /health:
    get:
      tags: [System]
      summary: Health check
      operationId: health
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
                  uptime:
                    type: number

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: refreshToken

  schemas:
    AuthResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        accountNo:
          type: string
          example: MKM10001
        roles:
          type: array
          items:
            type: string
        membership:
          type: string
          nullable: true
        accessToken:
          type: string

    LoginResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        accountNo:
          type: string
        roles:
          type: array
          items:
            type: string
        membership:
          type: string
          nullable: true
        accessToken:
          type: string
      x-bugs:
        - BUG-ADMIN-001: Missing name, email, phone, avatar, createdAt

    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        accountNo:
          type: string
        email:
          type: string
        name:
          type: string
        phone:
          type: string
          nullable: true
        avatar:
          type: string
        roles:
          type: array
          items:
            type: string
        membership:
          type: string
          nullable: true
        membershipExpiresAt:
          type: string
          format: date-time
          nullable: true
        isVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time

  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    RateLimited:
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
